<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remates UY</title><style>body{font:16px system-ui;background:#f1f5f9;color:#172b40;margin:0}header{background:#123451;color:white;padding:32px}main{max-width:1100px;margin:auto;padding:24px}input,select{padding:12px;border:1px solid #bac8d4;border-radius:8px;font:inherit;max-width:100%}section{display:flex;gap:10px;flex-wrap:wrap}article{background:white;padding:20px;border-radius:12px;margin:12px 0}a{color:#1264a3}small{color:#526779}h2{margin:0 0 10px}</style><header><h1>Remates UY</h1>Vehículos, inmuebles y otros bienes en Uruguay</header><main><section><input id="q" placeholder="Buscar marca, modelo, ubicación"><select id="tipo"><option value="">Todas las categorías</option><option>Vehículos</option><option>Inmuebles</option><option>Otros</option></select><select id="base"><option value="">Cualquier base</option><option>Sin base</option><option>Con base</option><option>No informado</option></select><label><input type="checkbox" id="vigentes" checked> Próximos y sin fecha confirmada</label></section><p id="estado" role="status">Cargando…</p><div id="lista"></div><h3>Fuentes para consultar</h3><p><a href="https://www.impo.com.uy/remates">IMPO</a> · <a href="https://www.aduanas.gub.uy/">Aduanas</a> · <a href="https://www.anv.gub.uy/">ANV</a> · <a href="https://www.bhu.com.uy/">BHU</a> · <a href="https://www.rematesdeuruguay.com/">Remates de Uruguay</a></p></main><script>let datos=[];const el=id=>document.getElementById(id);const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();function render(){const hoy=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Montevideo'}).format(new Date());const filas=datos.filter(x=>(!el('vigentes').checked||!x.fecha||x.fecha>=hoy)&&(!el('tipo').value||x.tipo===el('tipo').value)&&(!el('base').value||x.base_estado===el('base').value)&&norm(JSON.stringify(x)).includes(norm(el('q').value)));el('lista').replaceChildren();el('estado').textContent=filas.length+' avisos encontrados';for(const x of filas){const a=document.createElement('article');for(const [tag,value] of [['h2',x.titulo],['p',[x.fecha||'Fecha por confirmar',x.departamento||'Ubicación por confirmar',x.base||x.base_estado||'Base no informada'].join(' · ')],['p',x.detalle],['small',x.fuente]]){const n=document.createElement(tag);n.textContent=value||'';a.append(n)}const l=document.createElement('a');if(/^https?:\/\//i.test(x.url)){l.href=x.url;l.textContent='Ver aviso original';l.target='_blank';l.rel='noopener';a.append(document.createElement('br'),l)}el('lista').append(a)}}for(const id of ['q','tipo','base','vigentes'])el(id).addEventListener('input',render);fetch('data/remates.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{datos=x;render()}).catch(()=>el('estado').textContent='Datos aún no disponibles. Consultá las fuentes oficiales.');</script></html>
